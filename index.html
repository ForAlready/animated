<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><link rel="icon" href="data:,"> <title>Ria · 俏皮待机</title>
<style>body{margin:0;background:#e9e3ed;color:#493f52;font:15px 'Microsoft YaHei',sans-serif}canvas{display:block}aside{position:absolute;top:24px;left:24px;width:250px;max-height:calc(100vh - 92px);overflow:auto;padding:22px;border-radius:20px;background:#fffffff0;box-shadow:0 8px 35px #60446918}h1{margin:0 0 8px;font-size:24px}p{line-height:1.7;color:#75667e}button,a{display:inline-block;border:0;padding:10px 14px;margin:4px 2px;background:#7d5b93;color:white;border-radius:10px;text-decoration:none;cursor:pointer}label{display:block;margin:16px 0}input{width:100%}small{line-height:1.6;display:block;color:#887790}#status{position:absolute;bottom:22px;left:24px;background:#ffffffde;padding:10px 16px;border-radius:10px}</style>
<aside><h1>Ria · 俏皮待机</h1><p>轻轻呼吸，歪头看你。<br>眨眼、浅笑，还有一个小 wink。</p><label>切换服装<select id="outfit" style="display:block;width:100%;padding:9px;margin-top:8px" disabled></select></label><small id="outfitNote"></small><label>通用动作<select id="motion" style="display:block;width:100%;padding:9px;margin-top:8px"></select></label><small id="motionState">通用 · 待机</small><button id="play">暂停</button><button id="face">面部近景</button><button id="full">全身</button><button id="collision">裙摆碰撞：开</button><button id="debugColliders">显示碰撞体：关</button><button id="softness">柔软摆动：开</button>
<fieldset style="border:1px solid #d0c5d8;border-radius:10px;padding:12px;margin:12px 0"><legend style="padding:0 6px;color:#7d5b93;font-weight:bold">物理预设</legend><label><select id="preset" style="display:block;width:100%;padding:9px;margin-top:4px"><option value="normal" selected>自然适中 (normal)</option><option value="soft">柔软飘逸 (soft)</option><option value="hard">紧致轻盈 (hard)</option><option value="hair">发soft、裙normal</option><option value="skirt">裙soft、发normal</option></select></label><small>soft/normal/hard=全局乘子；hair/skirt=只改对应通道</small></fieldset>
<fieldset style="border:1px solid #d0c5d8;border-radius:10px;padding:12px;margin:12px 0"><legend style="padding:0 6px;color:#7d5b93;font-weight:bold">全局微调</legend><label>刚度 k <span id="uiMulKVal">1.00</span><input id="uiMulK" type="range" min="0.5" max="2" step="0.05" value="1"></label><label>阻尼 d <span id="uiMulDVal">1.00</span><input id="uiMulD" type="range" min="0.5" max="2" step="0.05" value="1"></label><label>灵敏度 gain <span id="uiMulGainVal">1.00</span><input id="uiMulGain" type="range" min="0.5" max="2" step="0.05" value="1"></label><label>幅度 limit <span id="uiMulLimitVal">1.00</span><input id="uiMulLimit" type="range" min="0.5" max="2" step="0.05" value="1"></label><small>建议范围 0.5–2；影响所有通道</small><button id="resetUiMul" style="margin-top:8px;width:100%">恢复默认</button></fieldset>
<details id="boneOverrideSection" style="margin:12px 0"><summary style="cursor:pointer;color:#7d5b93;font-weight:bold;padding:8px 0">单骨覆盖 ▸</summary><fieldset style="border:1px solid #d0c5d8;border-radius:10px;padding:12px;margin-top:8px"><label style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" id="boneOverrideEnable" style="width:auto"> 启用单骨覆盖</label><div id="boneOverrideControls" style="display:none"><label>骨骼<select id="boneSelect" style="display:block;width:100%;padding:9px;margin-top:4px"></select></label><label>k (空=继承)<input id="boneK" type="number" min="10" max="150" step="1" placeholder="10–150"></label><label>d (空=继承)<input id="boneD" type="number" min="3" max="25" step="0.5" placeholder="3–25"></label><label>gain (空=继承)<input id="boneGain" type="number" min="0.001" max="0.025" step="0.001" placeholder="0.001–0.025"></label><label>limit (空=继承)<input id="boneLimit" type="number" min="0.005" max="0.1" step="0.005" placeholder="0.005–0.10"></label><button id="applyBoneOverride" style="margin-top:8px;width:100%">应用覆盖</button><button id="clearBoneOverride" style="margin-top:4px;width:100%">清除此骨覆盖</button></div><small>空=继承全局设置；填了则用绝对值覆盖</small></fieldset></details><label>飘动强度 <input id="sway" type="range" min="0" max="1.5" step="0.1" value="1"></label><label>播放速度 <span id="speedValue">1.0×</span><input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="1"></label><label>动作进度 <span id="time">0.0 / 12 秒</span><input id="seek" type="range" min="0" max="12" step="0.033" value="0"></label><a id="download" href="Ria_Suit13_Playful.glb" download>保存模型与原待机</a><p><small>鼠标拖动旋转 · 滚轮缩放<br>肢体与表情同步；跳跃、拥抱结束回到待机。新动作在预览中实时运行。<br>这是新制作的待机动画，非游戏原动作。发梢支持随视角摆动。Suit13 额外启用裙摆摆动和腿部碰撞；其他套装尚未适配。</small></p></aside><div id="status">正在加载角色与表情…</div>

<script type="module">
import {ActionRegistry} from './action-registry.js';import {commonActions} from './common-actions.js';import {CharacterActions} from './action-system.js';import {SecondaryMotion,PHYSICS_BASELINES,PRESET_MULTIPLIERS} from './secondary-motion.js';import {configureTextures} from './render-quality.js';import {ClothCollision} from './cloth-collision.js';import * as T from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';import {OrbitControls} from './vendor/OrbitControls.js';
window.PHYSICS_BASELINES=PHYSICS_BASELINES;window.PRESET_MULTIPLIERS=PRESET_MULTIPLIERS;
const scene=new T.Scene();scene.background=new T.Color('#e9e3ed');const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xfff8f2,0xc1b9b5,1.85));for(const [x,y,z,p] of [[2,3,4,1.6],[-3,2,1,.7],[0,3,-2,.8]]){let l=new T.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l)}
const cameraFill=new T.DirectionalLight(0xfff7ef,.85);scene.add(cameraFill);scene.add(cameraFill.target);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let mixer,action,cloth,secondary,actions,playing=true,ready=false;const $=x=>document.getElementById(x);let size,center;
let faceView=false;function frame(face){faceView=face;let h=size.y;const large=actions&&actions.id!=='idle';controls.target.set(center.x,h*(face?.86:large?.62:.53),center.z);camera.position.set(center.x,h*(face?.87:large?.65:.58),center.z+h*(face?.70:large?2.5:2.05));controls.update()}
const registry=new ActionRegistry();commonActions.forEach(a=>{registry.registerCommon(a);$('motion').add(new Option(a.name,a.id))});window.actionRegistry=registry;let currentRoot=null,currentId=null,requestId=0;
const loader=new GLTFLoader();
function disposeRoot(root){const geometries=new Set(),materials=new Set(),textures=new Set(),skeletons=new Set();root.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.skeleton)skeletons.add(o.skeleton);for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(m){materials.add(m);for(const v of Object.values(m))if(v?.isTexture)textures.add(v)}});for(const x of [...geometries,...materials,...textures,...skeletons])x.dispose?.()}
const catalog=await fetch('./wardrobe.json').then(r=>{if(!r.ok)throw new Error('服装目录加载失败');return r.json()});
for(const e of catalog.outfits){const opt=new Option(e.label,e.id);$('outfit').add(opt)}
for(const id of catalog.missing){const opt=new Option(id+'（未找到模型）',id);opt.disabled=true;$('outfit').add(opt)}
async function selectOutfit(id){
 const entry=catalog.outfits.find(e=>e.id===id);if(!entry)return;const ticket=++requestId;$('outfit').disabled=true;$('status').textContent='正在加载 '+id+'…';
 let g;
 try{
  g=await loader.loadAsync('./'+entry.url+'?actions=2');if(ticket!==requestId){disposeRoot(g.scene);return}
  const quality=configureTextures(g.scene,renderer);g.scene.updateMatrixWorld(true);
  const nextMixer=new T.AnimationMixer(g.scene),nextAction=nextMixer.clipAction(g.animations[0]);nextAction.play();
  const nextActions=new CharacterActions(g.scene,nextMixer,g.animations[0],id,registry);if(actions)nextActions.play(actions.id,true);const nextSecondary=new SecondaryMotion(g.scene,controls);nextSecondary.strength=+$('sway').value;
  const nextCloth=entry.collision?new ClothCollision(g.scene):{enabled:false,reset(){},update(){},stats:{vertices:0,contacts:0}};
  if(currentRoot){actions.dispose();scene.remove(currentRoot);mixer.stopAllAction();mixer.uncacheRoot(currentRoot);disposeRoot(currentRoot)}
  currentRoot=g.scene;scene.add(currentRoot);mixer=nextMixer;action=nextAction;actions=nextActions;window.actions=actions;secondary=nextSecondary;cloth=nextCloth;cloth.update();
  const box=new T.Box3().setFromObject(g.scene);size=box.getSize(new T.Vector3());center=box.getCenter(new T.Vector3());if(!currentId)frame(false);
  currentId=id;ready=true;$('outfit').value=id;$('outfitNote').textContent=entry.note;
  $('collision').disabled=!entry.collision;$('collision').textContent=entry.collision?'裙摆碰撞：开':'本套碰撞：未适配';$('debugColliders').disabled=!entry.collision;$('debugColliders').textContent='显示碰撞体：关';$('softness').textContent='柔软摆动：开';$('preset').value='normal';$('uiMulK').value=$('uiMulD').value=$('uiMulGain').value=$('uiMulLimit').value=1;updateUiMulDisplay();$('boneOverrideEnable').checked=false;$('boneOverrideControls').style.display='none';$('boneSelect').innerHTML='';$('boneK').value=$('boneD').value=$('boneGain').value=$('boneLimit').value='';
  $('download').href=entry.url;$('download').download=entry.url;$('status').textContent=id+' 已载入 · '+entry.note;
  window.viewer={camera,controls,renderer,scene};window.character=g;window.mixer=mixer;window.cloth=cloth;window.secondary=secondary;window.renderQuality=quality;window.currentOutfit=id;window.ready=true;
  window.setAnimationTime=t=>{actions.seek(t);secondary.reset();cloth.reset();cloth.update();cameraFill.position.copy(camera.position);cameraFill.target.position.copy(controls.target);renderer.render(scene,camera)};
 }catch(e){if(g && g.scene!==currentRoot)disposeRoot(g.scene);$('status').textContent='加载失败：'+e.message;if(currentId)$('outfit').value=currentId;console.error(e);throw e}
 finally{if(ticket===requestId)$('outfit').disabled=false}
}
function updateUiMulDisplay(){$('uiMulKVal').textContent=(+$('uiMulK').value).toFixed(2);$('uiMulDVal').textContent=(+$('uiMulD').value).toFixed(2);$('uiMulGainVal').textContent=(+$('uiMulGain').value).toFixed(2);$('uiMulLimitVal').textContent=(+$('uiMulLimit').value).toFixed(2)}
function applyUiMul(){secondary.setUiMul({k:+$('uiMulK').value,d:+$('uiMulD').value,gain:+$('uiMulGain').value,limit:+$('uiMulLimit').value})}
window.selectOutfit=selectOutfit;window.wardrobe=catalog;
$('outfit').onchange=e=>selectOutfit(e.target.value).catch(()=>{});
await selectOutfit('Suit13');
$('motion').onchange=e=>{actions.play(e.target.value);frame(faceView);playing=true;$('play').textContent='暂停';secondary.reset();cloth.reset()};$('softness').onclick=()=>{secondary.enabled=!secondary.enabled;secondary.reset();$('softness').textContent='柔软摆动：'+(secondary.enabled?'开':'关')};$('preset').onchange=e=>{const v=e.target.value;secondary.setPreset(v,'all')};$('sway').oninput=e=>{secondary.strength=+e.target.value}
$('uiMulK').oninput=()=>{updateUiMulDisplay();applyUiMul()};$('uiMulD').oninput=()=>{updateUiMulDisplay();applyUiMul()};$('uiMulGain').oninput=()=>{updateUiMulDisplay();applyUiMul()};$('uiMulLimit').oninput=()=>{updateUiMulDisplay();applyUiMul()};
$('resetUiMul').onclick=()=>{$('uiMulK').value=$('uiMulD').value=$('uiMulGain').value=$('uiMulLimit').value=1;updateUiMulDisplay();secondary.resetUiMul();$('preset').value='normal';secondary.setPreset('normal','all')};
$('boneOverrideEnable').onchange=e=>{$('boneOverrideControls').style.display=e.target.checked?'block':'none';if(e.target.checked&&$('boneSelect').options.length===0){const bones=secondary.listBones();bones.forEach(b=>{$('boneSelect').add(new Option(b.shortName+' ('+b.category+')',b.shortName))})}};
$('boneSelect').onchange=()=>{const name=$('boneSelect').value;const ov=secondary.getSingleBoneOverride(name);$('boneK').value=ov?.k??'';$('boneD').value=ov?.d??'';$('boneGain').value=ov?.gain??'';$('boneLimit').value=ov?.limit??''};
$('applyBoneOverride').onclick=()=>{const name=$('boneSelect').value;if(!name)return;const ov={};if($('boneK').value!=='')ov.k=+$('boneK').value;if($('boneD').value!=='')ov.d=+$('boneD').value;if($('boneGain').value!=='')ov.gain=+$('boneGain').value;if($('boneLimit').value!=='')ov.limit=+$('boneLimit').value;secondary.setSingleBoneOverride(name,ov)};
$('clearBoneOverride').onclick=()=>{const name=$('boneSelect').value;if(!name)return;secondary.clearSingleBoneOverride(name);$('boneK').value=$('boneD').value=$('boneGain').value=$('boneLimit').value=''};$('collision').onclick=()=>{cloth.enabled=!cloth.enabled;cloth.reset();if(cloth.debugGroup)cloth.debugGroup.visible=cloth.enabled&&cloth.showColliders;$('collision').textContent='裙摆碰撞：'+(cloth.enabled?'开':'关')};$('debugColliders').onclick=()=>{if(cloth.setShowColliders){const show=!cloth.showColliders;cloth.setShowColliders(show);$('debugColliders').textContent='显示碰撞体：'+(show?'开':'关')}};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('face').onclick=()=>frame(true);$('full').onclick=()=>frame(false);$('speed').oninput=e=>{$('speedValue').textContent=Number(e.target.value).toFixed(2)+'×'};$('seek').oninput=e=>{playing=false;$('play').textContent='播放';actions?.seek(+e.target.value);cloth?.reset();secondary?.reset()};
const clock=new T.Clock();let wasHidden=false;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);controls.update();cameraFill.position.copy(camera.position);cameraFill.target.position.copy(controls.target);if(ready){if(wasHidden){secondary?.reset();cloth?.reset();wasHidden=false}const step=playing?dt*+$('speed').value:0;actions.beforeUpdate();mixer.update(step);actions.update(step);secondary.update(dt,{vertical:actions.id==='idle'?0:(currentRoot.position.y-(window.lastBodyY||0))/Math.max(dt,.001)});window.lastBodyY=currentRoot.position.y;cloth.update(dt);$('motion').value=actions.id;$('motionState').textContent=(actions.layer==='outfit'?'服饰专属':'通用')+' · '+actions.definition.name;$('time').textContent=actions.time.toFixed(1)+' / '+actions.duration+' 秒';$('seek').max=actions.duration;$('seek').value=actions.time}renderer.render(scene,camera)}loop();document.addEventListener('visibilitychange',()=>{if(document.hidden){secondary?.reset();cloth?.reset();clock.getDelta();wasHidden=true}});onresize=()=>{renderer.setPixelRatio(Math.min(devicePixelRatio,2));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></html>
