<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><link rel="icon" href="data:,"> <title>Ria · 俏皮待机</title>
<style>body{margin:0;background:#e9e3ed;color:#493f52;font:15px 'Microsoft YaHei',sans-serif}canvas{display:block}aside{position:absolute;top:24px;left:24px;width:250px;padding:22px;border-radius:20px;background:#fffffff0;box-shadow:0 8px 35px #60446918}h1{margin:0 0 8px;font-size:24px}p{line-height:1.7;color:#75667e}button,a{display:inline-block;border:0;padding:10px 14px;margin:4px 2px;background:#7d5b93;color:white;border-radius:10px;text-decoration:none;cursor:pointer}label{display:block;margin:16px 0}input{width:100%}small{line-height:1.6;display:block;color:#887790}#status{position:absolute;bottom:22px;left:24px;background:#ffffffde;padding:10px 16px;border-radius:10px}</style>
<aside><h1>Ria · 俏皮待机</h1><p>轻轻呼吸，歪头看你。<br>眨眼、浅笑，还有一个小 wink。</p><button id="play">暂停</button><button id="face">面部近景</button><button id="full">全身</button><label>播放速度 <span id="speedValue">1.0×</span><input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="1"></label><label>动作进度 <span id="time">0.0 / 12 秒</span><input id="seek" type="range" min="0" max="12" step="0.033" value="0"></label><a href="Ria_Suit13_Playful.glb" download>保存带动画模型</a><p><small>鼠标拖动旋转 · 滚轮缩放<br>12 秒循环 / 原模型表情形变<br>这是新制作的待机动画，非游戏原动作。服装与头发未加入物理模拟。</small></p></aside><div id="status">正在加载角色与表情…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as T from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';import {OrbitControls} from './vendor/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#e9e3ed');const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xfff6ed,0x807392,2.2));for(const [x,y,z,p] of [[2,3,4,2],[-3,2,1,1.3],[0,3,-2,1.6]]){let l=new T.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l)}
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let mixer,action,playing=true,ready=false;const $=x=>document.getElementById(x);let size,center;
function frame(face){let h=size.y;controls.target.set(center.x,h*(face?.86:.53),center.z);camera.position.set(center.x,h*(face?.87:.58),center.z+h*(face?.70:2.05));controls.update()}
new GLTFLoader().load('./Ria_Suit13_Playful.glb',g=>{scene.add(g.scene);g.scene.updateMatrixWorld(true);const box=new T.Box3().setFromObject(g.scene);size=box.getSize(new T.Vector3());center=box.getCenter(new T.Vector3());mixer=new T.AnimationMixer(g.scene);action=mixer.clipAction(g.animations[0]);action.play();frame(false);ready=true;$('status').textContent='正在播放 · 6.2 秒轻眨左眼 · 可拖动进度查看';window.character=g;window.mixer=mixer;window.ready=true;window.setAnimationTime=t=>{mixer.setTime(t);renderer.render(scene,camera)};},undefined,e=>{$('status').textContent='加载失败：'+e.message;console.error(e)});
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('face').onclick=()=>frame(true);$('full').onclick=()=>frame(false);$('speed').oninput=e=>{$('speedValue').textContent=Number(e.target.value).toFixed(2)+'×'};$('seek').oninput=e=>{playing=false;$('play').textContent='播放';mixer?.setTime(+e.target.value)};
const clock=new T.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(ready){if(playing)mixer.update(dt*+$('speed').value);$('time').textContent=action.time.toFixed(1)+' / 12 秒';$('seek').value=action.time}controls.update();renderer.render(scene,camera)}loop();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></html>
