<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><link rel="icon" href="data:,"> <title>Ria · 俏皮待机</title>
<style>body{margin:0;background:#e9e3ed;color:#493f52;font:15px 'Microsoft YaHei',sans-serif}canvas{display:block}aside{position:absolute;top:24px;left:24px;width:250px;max-height:calc(100vh - 92px);overflow:auto;padding:22px;border-radius:20px;background:#fffffff0;box-shadow:0 8px 35px #60446918}h1{margin:0 0 8px;font-size:24px}p{line-height:1.7;color:#75667e}button,a{display:inline-block;border:0;padding:10px 14px;margin:4px 2px;background:#7d5b93;color:white;border-radius:10px;text-decoration:none;cursor:pointer}label{display:block;margin:16px 0}input{width:100%}small{line-height:1.6;display:block;color:#887790}#status{position:absolute;bottom:22px;left:24px;background:#ffffffde;padding:10px 16px;border-radius:10px}</style>
<aside><h1>Ria · 俏皮待机</h1><p>轻轻呼吸，歪头看你。<br>眨眼、浅笑，还有一个小 wink。</p><label>切换服装<select id="outfit" style="display:block;width:100%;padding:9px;margin-top:8px" disabled></select></label><small id="outfitNote"></small><button id="play">暂停</button><button id="face">面部近景</button><button id="full">全身</button><button id="collision">裙摆碰撞：开</button><button id="softness">柔软摆动：开</button><label>飘动强度 <input id="sway" type="range" min="0" max="1.5" step="0.1" value="1"></label><label>播放速度 <span id="speedValue">1.0×</span><input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="1"></label><label>动作进度 <span id="time">0.0 / 12 秒</span><input id="seek" type="range" min="0" max="12" step="0.033" value="0"></label><a id="download" href="Ria_Suit13_Playful.glb" download>保存带动画模型</a><p><small>鼠标拖动旋转 · 滚轮缩放<br>12 秒循环 / 原模型表情形变<br>这是新制作的待机动画，非游戏原动作。发梢支持随视角摆动。Suit13 额外启用裙摆摆动和腿部碰撞；其他套装尚未适配。</small></p></aside><div id="status">正在加载角色与表情…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import {SecondaryMotion} from './secondary-motion.js';import {configureTextures} from './render-quality.js';import {ClothCollision} from './cloth-collision.js';import * as T from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';import {OrbitControls} from './vendor/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#e9e3ed');const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xfff8f2,0xc1b9b5,1.85));for(const [x,y,z,p] of [[2,3,4,1.6],[-3,2,1,.7],[0,3,-2,.8]]){let l=new T.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l)}
const cameraFill=new T.DirectionalLight(0xfff7ef,.85);scene.add(cameraFill);scene.add(cameraFill.target);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let mixer,action,cloth,secondary,playing=true,ready=false;const $=x=>document.getElementById(x);let size,center;
function frame(face){let h=size.y;controls.target.set(center.x,h*(face?.86:.53),center.z);camera.position.set(center.x,h*(face?.87:.58),center.z+h*(face?.70:2.05));controls.update()}
let currentRoot=null,currentId=null,requestId=0;
const loader=new GLTFLoader();
function disposeRoot(root){const geometries=new Set(),materials=new Set(),textures=new Set(),skeletons=new Set();root.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.skeleton)skeletons.add(o.skeleton);for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(m){materials.add(m);for(const v of Object.values(m))if(v?.isTexture)textures.add(v)}});for(const x of [...geometries,...materials,...textures,...skeletons])x.dispose?.()}
const catalog=await fetch('./wardrobe.json').then(r=>{if(!r.ok)throw new Error('服装目录加载失败');return r.json()});
for(const e of catalog.outfits){const opt=new Option(e.label,e.id);$('outfit').add(opt)}
for(const id of catalog.missing){const opt=new Option(id+'（未找到模型）',id);opt.disabled=true;$('outfit').add(opt)}
async function selectOutfit(id){
 const entry=catalog.outfits.find(e=>e.id===id);if(!entry)return;const ticket=++requestId;$('outfit').disabled=true;$('status').textContent='正在加载 '+id+'…';
 let g;
 try{
  g=await loader.loadAsync('./'+entry.url+'?wardrobe=2');if(ticket!==requestId){disposeRoot(g.scene);return}
  const quality=configureTextures(g.scene,renderer);g.scene.updateMatrixWorld(true);
  const nextMixer=new T.AnimationMixer(g.scene),nextAction=nextMixer.clipAction(g.animations[0]);nextAction.play();
  const nextSecondary=new SecondaryMotion(g.scene,controls);nextSecondary.strength=+$('sway').value;
  const nextCloth=entry.collision?new ClothCollision(g.scene):{enabled:false,reset(){},update(){},stats:{vertices:0,contacts:0}};
  if(currentRoot){scene.remove(currentRoot);mixer.stopAllAction();mixer.uncacheRoot(currentRoot);disposeRoot(currentRoot)}
  currentRoot=g.scene;scene.add(currentRoot);mixer=nextMixer;action=nextAction;secondary=nextSecondary;cloth=nextCloth;cloth.update();
  const box=new T.Box3().setFromObject(g.scene);size=box.getSize(new T.Vector3());center=box.getCenter(new T.Vector3());if(!currentId)frame(false);
  currentId=id;ready=true;$('outfit').value=id;$('outfitNote').textContent=entry.note;
  $('collision').disabled=!entry.collision;$('collision').textContent=entry.collision?'裙摆碰撞：开':'本套碰撞：未适配';$('softness').textContent='柔软摆动：开';
  $('download').href=entry.url;$('download').download=entry.url;$('status').textContent=id+' 已载入 · '+entry.note;
  window.viewer={camera,controls,renderer,scene};window.character=g;window.mixer=mixer;window.cloth=cloth;window.secondary=secondary;window.renderQuality=quality;window.currentOutfit=id;window.ready=true;
  window.setAnimationTime=t=>{mixer.setTime(t);secondary.reset();cloth.reset();cloth.update();cameraFill.position.copy(camera.position);cameraFill.target.position.copy(controls.target);renderer.render(scene,camera)};
 }catch(e){if(g && g.scene!==currentRoot)disposeRoot(g.scene);$('status').textContent='加载失败：'+e.message;if(currentId)$('outfit').value=currentId;console.error(e);throw e}
 finally{if(ticket===requestId)$('outfit').disabled=false}
}
window.selectOutfit=selectOutfit;window.wardrobe=catalog;
$('outfit').onchange=e=>selectOutfit(e.target.value).catch(()=>{});
await selectOutfit('Suit13');
$('softness').onclick=()=>{secondary.enabled=!secondary.enabled;secondary.reset();$('softness').textContent='柔软摆动：'+(secondary.enabled?'开':'关')};$('sway').oninput=e=>{secondary.strength=+e.target.value};$('collision').onclick=()=>{cloth.enabled=!cloth.enabled;cloth.reset();$('collision').textContent='裙摆碰撞：'+(cloth.enabled?'开':'关')};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('face').onclick=()=>frame(true);$('full').onclick=()=>frame(false);$('speed').oninput=e=>{$('speedValue').textContent=Number(e.target.value).toFixed(2)+'×'};$('seek').oninput=e=>{playing=false;$('play').textContent='播放';mixer?.setTime(+e.target.value);cloth?.reset();secondary?.reset()};
const clock=new T.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);controls.update();cameraFill.position.copy(camera.position);cameraFill.target.position.copy(controls.target);if(ready){if(playing)mixer.update(dt*+$('speed').value);secondary.update(dt);cloth.update(dt);$('time').textContent=action.time.toFixed(1)+' / 12 秒';$('seek').value=action.time}renderer.render(scene,camera)}loop();onresize=()=>{renderer.setPixelRatio(Math.min(devicePixelRatio,2));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></html>
